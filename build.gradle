plugins {
    id 'java'
    id 'application'
}

group = 'io.github.seraphina'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'net.java.dev.jna:jna:5.19.1'
    implementation 'org.apache.logging.log4j:log4j-api:2.26.1'
    implementation 'org.ow2.asm:asm:9.9.1'
    implementation 'org.lwjgl:lwjgl:3.3.3'
    implementation 'org.apache.commons:commons-lang3:3.20.0'
    runtimeOnly 'org.apache.logging.log4j:log4j-core:2.26.1'
    runtimeOnly 'org.lwjgl:lwjgl:3.3.3:natives-windows'
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'io.github.seraphina.Start'
}

def nativeProjectDirectory = file('src/main/natives')
def nativeLibraryDirectory = file('src/main/natives/target/release')
def generatedNativeResourceDirectory = layout.buildDirectory.dir('generated/resources/native')

tasks.register('buildNative', Exec) {
    group = 'build'
    description = 'Builds sera_bypass.dll from the Rust JNI project.'
    workingDir = nativeProjectDirectory
    commandLine 'cargo', 'build', '--release'

    inputs.files(fileTree(nativeProjectDirectory) {
        include 'Cargo.toml', 'Cargo.lock', 'src/**'
    })
    outputs.file(file("${nativeLibraryDirectory}/sera_bypass.dll"))
}

tasks.register('copyNativeLibrary', Copy) {
    group = 'build'
    description = 'Stages the Rust DLL as a packaged Java resource.'
    dependsOn tasks.named('buildNative')
    from(nativeLibraryDirectory) {
        include 'sera_bypass.dll'
    }
    into(generatedNativeResourceDirectory)
}

tasks.named('processResources') {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    dependsOn tasks.named('copyNativeLibrary')
    from(tasks.named('copyNativeLibrary'))
}

test {
    useJUnitPlatform()
}



